name: Plan affected checks
description: Select affected components and the Gradle tasks that check them

inputs:
  base:
    description: Base Git revision
    required: false
    default: ""
  head:
    description: Head Git revision
    required: false
    default: HEAD
  component:
    description: Optional component subject
    required: false
    default: ""
  all:
    description: Select every component
    required: false
    default: "false"
outputs:
  build:
    description: Build entries as JSON
    value: ${{ steps.plan.outputs.build }}
  unit:
    description: Unit-test entries as JSON
    value: ${{ steps.plan.outputs.unit }}
  gametest:
    description: GameTest entries as JSON
    value: ${{ steps.plan.outputs.gametest }}
  client:
    description: Client-test entries as JSON
    value: ${{ steps.plan.outputs.client }}
  validate:
    description: Pack-validation entries as JSON
    value: ${{ steps.plan.outputs.validate }}
  tasks:
    description: Ordered JSON array of Gradle task paths for one invocation
    value: ${{ steps.plan.outputs.tasks }}
  has-work:
    description: Whether the plan selected any checks
    value: ${{ steps.plan.outputs.has-work }}
  wayland:
    description: Whether the selected tasks include client tests
    value: ${{ steps.plan.outputs.wayland }}

runs:
  using: composite
  steps:
    - name: Resolve affected components
      id: plan
      shell: bash
      env:
        BERTIE_PLAN_BASE: ${{ inputs.base }}
        BERTIE_PLAN_HEAD: ${{ inputs.head }}
        BERTIE_PLAN_COMPONENT: ${{ inputs.component }}
        BERTIE_PLAN_ALL: ${{ inputs.all }}
      run: python3 "$GITHUB_ACTION_PATH/run.py"
