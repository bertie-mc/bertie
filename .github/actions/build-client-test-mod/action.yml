name: Build client test mod
description: Build and stage a component's test-only client mod

inputs:
  component:
    description: Workspace component subject; omit for a standalone checkout
    required: false
    default: ""
  project:
    description: Standalone mod checkout
    required: false
    default: .
  artifact-dir:
    description: Directory for the staged test mod
    required: true

outputs:
  artifact:
    description: Stable path to the staged test mod
    value: ${{ inputs.artifact-dir }}/client-test-mod.jar

runs:
  using: composite
  steps:
    - name: Build workspace client test mod
      if: inputs.component != ''
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
        BERTIE_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
      run: >-
        bertie-ci build-client-test-mod --workspace . --component "$BERTIE_COMPONENT"
        --output-dir "$BERTIE_ARTIFACT_DIR"
    - name: Build standalone client test mod
      if: inputs.component == ''
      shell: bash
      env:
        BERTIE_PROJECT: ${{ inputs.project }}
        BERTIE_ARTIFACT_DIR: ${{ inputs.artifact-dir }}
      run: >-
        bertie-ci build-client-test-mod --project "$BERTIE_PROJECT"
        --output-dir "$BERTIE_ARTIFACT_DIR"
