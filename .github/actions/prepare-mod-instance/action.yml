name: Prepare mod instance
description: Install fixtures and a built mod into a side-specific instance

inputs:
  component:
    description: Workspace component subject; omit for a standalone checkout
    required: false
    default: ""
  project:
    description: Standalone mod checkout
    required: false
    default: .
  artifact:
    description: JAR or directory containing one JAR
    required: true
  fixture:
    description: Comma-separated canonical pack fixtures
    required: false
    default: ""
  instance-files:
    description: Component directory copied into the prepared game directory
    required: false
    default: ""
  side:
    description: client or server
    required: true
  output-dir:
    description: Prepared instance directory
    required: true

outputs:
  descriptor:
    description: Prepared instance descriptor
    value: ${{ inputs.output-dir }}/instance.json

runs:
  using: composite
  steps:
    - name: Prepare workspace mod instance
      if: inputs.component != ''
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
        BERTIE_ARTIFACT: ${{ inputs.artifact }}
        BERTIE_FIXTURE: ${{ inputs.fixture }}
        BERTIE_INSTANCE_FILES: ${{ inputs.instance-files }}
        BERTIE_SIDE: ${{ inputs.side }}
        BERTIE_OUTPUT: ${{ inputs.output-dir }}
      run: >-
        bertie-ci prepare-mod-instance --workspace . --component "$BERTIE_COMPONENT"
        --artifact "$BERTIE_ARTIFACT" --fixture "$BERTIE_FIXTURE"
        --instance-files "$BERTIE_INSTANCE_FILES"
        --side "$BERTIE_SIDE" --output-dir "$BERTIE_OUTPUT"
    - name: Prepare standalone mod instance
      if: inputs.component == ''
      shell: bash
      env:
        BERTIE_PROJECT: ${{ inputs.project }}
        BERTIE_ARTIFACT: ${{ inputs.artifact }}
        BERTIE_FIXTURE: ${{ inputs.fixture }}
        BERTIE_INSTANCE_FILES: ${{ inputs.instance-files }}
        BERTIE_SIDE: ${{ inputs.side }}
        BERTIE_OUTPUT: ${{ inputs.output-dir }}
      run: >-
        bertie-ci prepare-mod-instance --project "$BERTIE_PROJECT"
        --artifact "$BERTIE_ARTIFACT" --fixture "$BERTIE_FIXTURE"
        --instance-files "$BERTIE_INSTANCE_FILES"
        --side "$BERTIE_SIDE" --output-dir "$BERTIE_OUTPUT"
