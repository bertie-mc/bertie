name: Provide Gradle dependencies
description: Prepare the persistent cache or download the dependency snapshot for this run

inputs:
  prepare:
    description: Populate and save the exact cache entry when it is absent
    required: false
    default: "true"
  offline:
    description: Require subsequent Gradle invocations to use only the prepared snapshot
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure Gradle User Home
      shell: bash
      run: |
        printf 'GRADLE_USER_HOME=%s\n' \
          "$GITHUB_WORKSPACE/.bertie-ci/gradle-user-home" >> "$GITHUB_ENV"

    - name: Restore dependency cache
      if: inputs.prepare == 'true'
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/modules-2
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/assets
        key: bertie-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.lockfile', 'build-logic/src/**', 'deps/**', 'gradle/**', 'gradle.properties', 'flake.nix', 'flake.lock') }}
        restore-keys: |
          bertie-gradle-

    - name: Prepare dependencies after a cache miss
      if: inputs.prepare == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GRADLE_OPTS: >-
          -Dorg.gradle.configuration-cache=false
          -Dorg.gradle.parallel=false
          -Dorg.gradle.workers.max=1
      run: >-
        bertie-ci gradle-task
        --workspace .
        --task prepareOfflineBuild
        --work-dir .bertie-ci/dependencies
        --timeout 3300

    - name: Save prepared dependencies
      if: inputs.prepare == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/modules-2
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/assets
        key: bertie-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.lockfile', 'build-logic/src/**', 'deps/**', 'gradle/**', 'gradle.properties', 'flake.nix', 'flake.lock') }}

    - name: Download prepared dependencies
      if: inputs.prepare != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gradle-dependencies-${{ github.sha }}
        path: ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches

    - name: Use prepared dependencies offline
      if: inputs.offline == 'true'
      shell: bash
      run: |
        printf '%s\n' 'BERTIE_CI_GRADLE_OFFLINE=true' >> "$GITHUB_ENV"
