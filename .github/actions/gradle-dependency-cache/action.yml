name: Restore Gradle dependencies
description: Restore the prepared dependency cache and optionally populate an exact entry

inputs:
  prepare:
    description: Populate and save the exact cache entry when it is absent
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure Gradle User Home
      shell: bash
      run: |
        printf 'GRADLE_USER_HOME=%s\n' \
          "$GITHUB_WORKSPACE/.bertie-ci/gradle-user-home" >> "$GITHUB_ENV"

    - name: Restore prepared dependencies
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/modules-2
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/assets
        key: bertie-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.lockfile', 'build-logic/src/**', 'gradle/**', 'gradle.properties', 'flake.nix', 'flake.lock') }}
        restore-keys: |
          bertie-gradle-

    - name: Prepare dependencies after a cache miss
      if: inputs.prepare == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GRADLE_OPTS: >-
          -Dorg.gradle.configuration-cache=false
          -Dorg.gradle.parallel=false
          -Dorg.gradle.workers.max=1
      run: >-
        bertie-ci gradle-task
        --workspace .
        --task prepareOfflineBuild
        --work-dir .bertie-ci/dependencies
        --timeout 3300

    - name: Save prepared dependencies
      if: inputs.prepare == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/modules-2
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/assets
        key: bertie-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.lockfile', 'build-logic/src/**', 'gradle/**', 'gradle.properties', 'flake.nix', 'flake.lock') }}

    - name: Use prepared dependencies offline
      shell: bash
      run: |
        printf '%s\n' 'BERTIE_CI_GRADLE_OFFLINE=true' >> "$GITHUB_ENV"
