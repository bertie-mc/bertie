name: Prepare or restore Gradle dependencies
description: Seed the preparation job or restore the dependency artifact it produced

inputs:
  warm:
    description: Seed and populate the cache instead of requiring an exact entry
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore dependency seed
      if: inputs.warm == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/modules-2
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/neoformruntime/assets
        key: bertie-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.lockfile', 'build-logic/src/**', 'gradle/**', 'gradle.properties', 'flake.nix', 'flake.lock') }}
        restore-keys: |
          bertie-gradle-

    - name: Download prepared dependencies
      if: inputs.warm != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: gradle-dependencies-${{ github.sha }}
        path: ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches

    - name: Configure Gradle User Home
      shell: bash
      env:
        BERTIE_WARM: ${{ inputs.warm }}
      run: |
        printf 'GRADLE_USER_HOME=%s\n' \
          "$GITHUB_WORKSPACE/.bertie-ci/gradle-user-home" >> "$GITHUB_ENV"
        if [[ "$BERTIE_WARM" != true ]]; then
          printf '%s\n' 'BERTIE_CI_GRADLE_OFFLINE=true' >> "$GITHUB_ENV"
        fi
