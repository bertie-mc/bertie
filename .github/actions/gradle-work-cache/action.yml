name: Restore Gradle work cache
description: Reuse cacheable Gradle task outputs and artifact transformations for one CI job

inputs:
  kind:
    description: Job kind such as non-client or client-test
    required: true

runs:
  using: composite
  steps:
    - name: Restore Gradle work cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/build-cache-1
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/*/transforms
          ${{ github.workspace }}/.bertie-ci/gradle-user-home/caches/transforms-*
        key: bertie-gradle-work-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'deps/**', 'gradle/libs.versions.toml', 'gradle.properties') }}-${{ inputs.kind }}-${{ github.sha }}
        restore-keys: |
          bertie-gradle-work-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'deps/**', 'gradle/libs.versions.toml', 'gradle.properties') }}-${{ inputs.kind }}-
