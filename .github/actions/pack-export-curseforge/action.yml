name: Export CurseForge pack
description: Generate a CurseForge client import archive

inputs:
  component:
    description: Pack component subject
    required: false
    default: pack
  output:
    description: Output .zip path
    required: true

runs:
  using: composite
  steps:
    - name: Export CurseForge client pack
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
        BERTIE_OUTPUT: ${{ inputs.output }}
      run: >-
        bertie-ci pack-export-curseforge --workspace . --component "$BERTIE_COMPONENT"
        --output "$BERTIE_OUTPUT"
