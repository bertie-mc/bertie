name: Run planned checks
description: Run every planned Gradle task once and validate generated packs

inputs:
  tasks:
    description: JSON array of Gradle task paths from the plan action
    required: true
  validate:
    description: Pack-validation entries from the plan action
    required: true
  wayland:
    description: Provide an isolated native-Wayland compositor
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run planned checks
      shell: bash
      env:
        BERTIE_GRADLE_TASKS: ${{ inputs.tasks }}
        BERTIE_PACK_VALIDATIONS: ${{ inputs.validate }}
        BERTIE_CHECK_WAYLAND: ${{ inputs.wayland }}
      run: python3 "$GITHUB_ACTION_PATH/run.py"
