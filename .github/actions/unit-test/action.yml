name: Run JVM unit tests
description: Run one component's ordinary Gradle unit-test task

inputs:
  component:
    description: Workspace component subject; omit for a standalone checkout
    required: false
    default: ""
  project:
    description: Standalone mod checkout
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Test workspace component
      if: inputs.component != ''
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
      run: bertie-ci unit-test --workspace . --component "$BERTIE_COMPONENT"
    - name: Test standalone mod
      if: inputs.component == ''
      shell: bash
      env:
        BERTIE_PROJECT: ${{ inputs.project }}
      run: bertie-ci unit-test --project "$BERTIE_PROJECT"
