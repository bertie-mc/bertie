name: Test prepared Minecraft server
description: Run a project-owned HeadlessMC command suite in a prepared server

inputs:
  instance:
    description: Prepared server instance descriptor
    required: true
  command-test:
    description: Project-owned HeadlessMC command-test JSON
    required: true
  test-mod:
    description: Optional test-only mod JAR or artifact directory
    required: false
    default: ""
  require-log:
    description: JSON array of exact required server log text values
    required: false
    default: "[]"
  work-dir:
    description: Runtime state and logs directory
    required: true
  cache-dir:
    description: Minecraft download cache
    required: false
    default: .bertie-ci/cache
  timeout:
    description: Runtime timeout in seconds
    required: false
    default: "900"
  max-memory:
    description: Maximum Java heap
    required: false
    default: 3G

runs:
  using: composite
  steps:
    - name: Run server scenario
      shell: bash
      env:
        BERTIE_INSTANCE: ${{ inputs.instance }}
        BERTIE_COMMAND_TEST: ${{ inputs.command-test }}
        BERTIE_TEST_MOD: ${{ inputs.test-mod }}
        BERTIE_REQUIRE_LOG: ${{ inputs.require-log }}
        BERTIE_WORK_DIR: ${{ inputs.work-dir }}
        BERTIE_CACHE_DIR: ${{ inputs.cache-dir }}
        BERTIE_TIMEOUT: ${{ inputs.timeout }}
        BERTIE_MAX_MEMORY: ${{ inputs.max-memory }}
      run: python3 "$GITHUB_ACTION_PATH/../run-runtime.py" server
