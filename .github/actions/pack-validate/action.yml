name: Validate pack
description: Generate the packwiz output with Gradle, then structurally validate it read-only

inputs:
  component:
    description: Pack component subject
    required: false
    default: pack

runs:
  using: composite
  steps:
    - name: Validate pack
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
      run: bertie-ci pack-validate --workspace . --component "$BERTIE_COMPONENT"
