name: Export client pack
description: Generate the side-aware packwiz tree and export it as a Modrinth pack

inputs:
  component:
    description: Pack component subject
    required: false
    default: pack
  output:
    description: Output .mrpack path
    required: true

runs:
  using: composite
  steps:
    - name: Export client pack
      shell: bash
      env:
        BERTIE_COMPONENT: ${{ inputs.component }}
        BERTIE_OUTPUT: ${{ inputs.output }}
      run: >-
        bertie-ci pack-export-client --workspace . --component "$BERTIE_COMPONENT"
        --output "$BERTIE_OUTPUT"
