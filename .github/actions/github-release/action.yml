name: Publish GitHub release
description: Publish already-built files to the current tag's release

inputs:
  files:
    description: Newline-separated file globs; omit for a source-only release
    required: false
    default: ""
  name:
    description: Release title
    required: true
  body:
    description: Release description
    required: true

runs:
  using: composite
  steps:
    - name: Create GitHub release with assets
      if: inputs.files != ''
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: ${{ inputs.files }}
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        generate_release_notes: false
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
    - name: Create source-only GitHub release
      if: inputs.files == ''
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        name: ${{ inputs.name }}
        body: ${{ inputs.body }}
        generate_release_notes: false
        draft: false
        prerelease: false
