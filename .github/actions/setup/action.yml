name: Set up bertie-ci
description: Install Nix and add the repository-pinned bertie-ci command to PATH

inputs:
  gradle-cache:
    description: Configure the Gradle User Home and build caches
    required: false
    default: "false"
  gradle-cache-read-only:
    description: Restore Gradle state without publishing new cache entries
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Configure Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      with:
        use-gha-cache: enabled
        use-flakehub: disabled

    - name: Configure Gradle cache
      if: inputs.gradle-cache == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        validate-wrappers: false
        add-job-summary: on-failure

    - name: Install bertie-ci command
      shell: bash
      run: |
        package="$(nix build "${GITHUB_ACTION_PATH}/../../..#ci-tools" --no-link --print-out-paths)"
        "$package/bin/bertie-ci" --help > /dev/null
        "$package/bin/python3" --version > /dev/null
        printf '%s\n' "$package/bin" >> "$GITHUB_PATH"
