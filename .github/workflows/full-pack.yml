name: Full pack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: full-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full pack
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Plan pack checks
        id: plan
        uses: ./.github/actions/plan
        with:
          component: pack

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-dependency-cache

      - name: Run pack checks
        uses: ./.github/actions/gradle-check
        with:
          tasks: ${{ steps.plan.outputs.tasks }}
          validate: ${{ steps.plan.outputs.validate }}
          wayland: ${{ steps.plan.outputs.wayland }}

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-pack-${{ github.sha }}
          path: |
            .bertie-ci/
            pack/build/reports/
            pack/build/test-results/
            pack/build/test-diagnostics/
            pack/build/minecraft-runs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
