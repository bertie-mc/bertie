name: Full pack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: full-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan runtime suites
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.plan.outputs.client }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read pack suites
        id: plan
        uses: ./.github/actions/plan
        with:
          component: pack
          include-manual: true

  build:
    name: Build workspace mods
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true
          gradle-cache-read-only: false

      - name: Build mods
        uses: ./.github/actions/build-mod
        with:
          all-mods: true

      - name: Upload built mods
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-mods-${{ github.sha }}
          path: .bertie-ci/artifacts/*/*.jar
          if-no-files-found: error
          retention-days: 7

  client:
    name: Client / ${{ matrix.subject }} / ${{ matrix.suite }}
    needs: [plan, build]
    if: needs.plan.outputs.client != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.client) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Restore Minecraft runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bertie-ci/minecraft
          key: bertie-ci-minecraft-${{ runner.os }}-client-${{ hashFiles('tools/bertie-ci/versions.json') }}

      - name: Download workspace mods
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workspace-mods-${{ github.sha }}
          path: .bertie-ci/artifacts

      - name: Prepare client pack
        uses: ./.github/actions/prepare-pack-instance
        with:
          component: ${{ matrix.subject }}
          side: client
          output-dir: .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}

      - name: Overlay workspace mods
        uses: ./.github/actions/overlay-components
        with:
          instance: .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}/instance.json
          artifact-dir: .bertie-ci/artifacts
          pack-component: ${{ matrix.subject }}

      - name: Run client suite
        uses: ./.github/actions/client-test
        with:
          instance: .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}/instance.json
          work-dir: .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}
          minimum-game-tests: ${{ matrix.minimum_game_tests }}
          require-log: ${{ toJSON(matrix.require_log) }}
          timeout: ${{ matrix.timeout }}
          max-memory: ${{ matrix.max_memory }}

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pack-client-${{ matrix.suite }}-${{ github.sha }}
          path: |
            .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}/**/*.log
            .bertie-ci/client/${{ matrix.subject }}/${{ matrix.suite }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14

  server:
    name: Server / ${{ matrix.subject }} / ${{ matrix.suite }}
    needs: [plan, build]
    if: needs.plan.outputs.server != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.server) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Restore Minecraft runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bertie-ci/minecraft
          key: bertie-ci-minecraft-${{ runner.os }}-server-${{ hashFiles('tools/bertie-ci/versions.json') }}

      - name: Download workspace mods
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workspace-mods-${{ github.sha }}
          path: .bertie-ci/artifacts

      - name: Prepare server pack
        uses: ./.github/actions/prepare-pack-instance
        with:
          component: ${{ matrix.subject }}
          side: server
          output-dir: .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}

      - name: Overlay workspace mods
        uses: ./.github/actions/overlay-components
        with:
          instance: .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}/instance.json
          artifact-dir: .bertie-ci/artifacts
          pack-component: ${{ matrix.subject }}

      - name: Run server suite
        uses: ./.github/actions/server-test
        with:
          instance: .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}/instance.json
          work-dir: .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}
          command-test: ${{ matrix.project }}/${{ matrix.command_test }}
          require-log: ${{ toJSON(matrix.require_log) }}
          timeout: ${{ matrix.timeout }}
          max-memory: ${{ matrix.max_memory }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pack-server-${{ matrix.suite }}-${{ github.sha }}
          path: |
            .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}/**/*.log
            .bertie-ci/server/${{ matrix.subject }}/${{ matrix.suite }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
