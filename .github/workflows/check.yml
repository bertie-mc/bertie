name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Plan and prepare dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      non-client-tasks: ${{ steps.plan.outputs.non-client-tasks }}
      client-tasks: ${{ steps.plan.outputs.client-tasks }}
      validate: ${{ steps.plan.outputs.validate }}
      has-work: ${{ steps.plan.outputs.has-work }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan affected checks
        id: plan
        uses: ./.github/actions/plan
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up dependencies
        if: steps.plan.outputs.has-work == 'true'
        uses: ./.github/actions/setup

      - name: Prepare Gradle dependencies
        if: steps.plan.outputs.has-work == 'true'
        uses: ./.github/actions/gradle-dependency-cache

      - name: Publish Gradle dependencies for this run
        if: steps.plan.outputs.has-work == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gradle-dependencies-${{ github.sha }}
          path: |
            .bertie-ci/gradle-user-home/caches/modules-2
            .bertie-ci/gradle-user-home/caches/neoformruntime/artifacts
            .bertie-ci/gradle-user-home/caches/neoformruntime/assets
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

      - name: Upload dependency preparation log
        if: failure() && steps.plan.outputs.has-work == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-preparation-${{ github.sha }}
          path: .bertie-ci/dependencies/gradle.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  non-client:
    name: Build, unit tests, and GameTests
    needs: prepare
    if: needs.prepare.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-dependency-cache
        with:
          prepare: "false"

      - name: Restore Gradle work cache
        uses: ./.github/actions/gradle-work-cache
        with:
          kind: non-client

      - name: Check Nix flake
        id: nix
        continue-on-error: true
        run: nix flake check

      - name: Run non-client checks
        id: gradle
        continue-on-error: true
        uses: ./.github/actions/gradle-check
        with:
          tasks: ${{ needs.prepare.outputs.non-client-tasks }}
          validate: ${{ needs.prepare.outputs.validate }}
          work-dir: .bertie-ci/gradle/non-client
          timeout: "5100"

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: non-client-${{ github.sha }}
          path: |
            .bertie-ci/gradle/non-client/gradle.log
            **/build/reports/tests/test/
            **/build/test-results/test/
            **/build/test-results/gametest/
            **/build/minecraft-runs/gametest/logs/
            **/build/minecraft-runs/gametest/crash-reports/
            **/build/minecraft-runs/gametest/hs_err_pid*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Conclude non-client checks
        if: always()
        shell: bash
        env:
          NIX_OUTCOME: ${{ steps.nix.outcome }}
          GRADLE_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          if [[ "$NIX_OUTCOME" == failure || "$GRADLE_OUTCOME" == failure ]]; then
            exit 1
          fi

  client-test:
    name: Client tests
    needs: prepare
    if: needs.prepare.outputs.client-tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-dependency-cache
        with:
          prepare: "false"

      - name: Restore Gradle work cache
        uses: ./.github/actions/gradle-work-cache
        with:
          kind: client-test

      - name: Run client tests
        uses: ./.github/actions/gradle-check
        with:
          tasks: ${{ needs.prepare.outputs.client-tasks }}
          validate: "[]"
          work-dir: .bertie-ci/gradle/client-test
          timeout: "6900"
          wayland: "true"

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-test-${{ github.sha }}
          path: |
            .bertie-ci/gradle/client-test/gradle.log
            .bertie-ci/gradle/client-test/wayland.log
            **/build/test-results/clienttest/
            **/build/test-diagnostics/clienttest/
            **/build/minecraft-runs/clienttest/logs/
            **/build/minecraft-runs/clienttest/crash-reports/
            **/build/minecraft-runs/clienttest/screenshots/
            **/build/minecraft-runs/clienttest/hs_err_pid*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  dependency-restoration:
    name: Dependency restoration (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore prepared dependencies
        uses: ./.github/actions/gradle-dependency-cache
        with:
          prepare: "false"
          offline: "false"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.14.4"
          cache-disabled: true

      - name: Restore locked dependencies
        run: gradle resolveAndLockAll --no-daemon --stacktrace --console=plain
