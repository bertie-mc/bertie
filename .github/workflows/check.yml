name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan affected checks
        id: plan
        uses: ./.github/actions/plan
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}

      - name: Set up dependencies
        if: steps.plan.outputs.has-work == 'true'
        uses: ./.github/actions/setup

      - name: Restore Gradle dependencies
        if: steps.plan.outputs.has-work == 'true'
        uses: ./.github/actions/gradle-dependency-cache

      - name: Check Nix flake
        id: nix
        if: steps.plan.outputs.has-work == 'true'
        continue-on-error: true
        run: nix flake check

      - name: Run planned checks
        id: planned
        if: steps.plan.outputs.has-work == 'true'
        continue-on-error: true
        uses: ./.github/actions/gradle-check
        with:
          tasks: ${{ steps.plan.outputs.tasks }}
          validate: ${{ steps.plan.outputs.validate }}
          wayland: ${{ steps.plan.outputs.wayland }}

      - name: Upload reports and diagnostics
        if: always() && steps.plan.outputs.has-work == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-${{ github.sha }}
          path: |
            .bertie-ci/
            **/build/reports/
            **/build/test-results/
            **/build/test-diagnostics/
            **/build/minecraft-runs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Conclude checks
        if: always() && steps.plan.outputs.has-work == 'true'
        shell: bash
        env:
          NIX_OUTCOME: ${{ steps.nix.outcome }}
          PLANNED_OUTCOME: ${{ steps.planned.outcome }}
        run: |
          if [[ "$NIX_OUTCOME" == failure || "$PLANNED_OUTCOME" == failure ]]; then
            exit 1
          fi
