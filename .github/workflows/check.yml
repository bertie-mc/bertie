name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan affected components
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      unit: ${{ steps.plan.outputs.unit }}
      gametest: ${{ steps.plan.outputs.gametest }}
      client: ${{ steps.plan.outputs.client }}
      validate: ${{ steps.plan.outputs.validate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        uses: ./.github/actions/plan
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}

  infrastructure:
    name: Shared infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true

      - name: Check Nix flake
        run: nix flake check

      - name: Test Gradle infrastructure
        uses: ./.github/actions/gradle-task
        with:
          task: testInfrastructure
          work-dir: .bertie-ci/infrastructure
          timeout: 1200

      - name: Upload infrastructure-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infrastructure-${{ github.sha }}
          path: |
            .bertie-ci/infrastructure/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
            testing/*/build/reports/tests/
            testing/*/build/test-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  gradle:
    name: Affected builds and unit tests
    needs: plan
    if: needs.plan.outputs.build != '[]' || needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true
          gradle-cache-read-only: false

      - name: Run affected tasks
        uses: ./.github/actions/gradle-check
        with:
          build: ${{ needs.plan.outputs.build }}
          unit: ${{ needs.plan.outputs.unit }}

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gradle-${{ github.sha }}
          path: |
            .bertie-ci/gradle/
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  gametest:
    name: GameTest / ${{ matrix.subject }}
    needs: plan
    if: needs.plan.outputs.gametest != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gametest) }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true

      - name: Run GameTests
        uses: ./.github/actions/gradle-task
        with:
          task: ${{ matrix.task }}
          work-dir: .bertie-ci/gametest/${{ matrix.subject }}
          timeout: ${{ matrix.timeout }}

      - name: Upload GameTest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gametest-${{ matrix.subject }}-${{ github.sha }}
          path: |
            .bertie-ci/gametest/${{ matrix.subject }}/
            ${{ matrix.project }}/build/reports/
            ${{ matrix.project }}/build/test-results/gametest/
            ${{ matrix.project }}/build/runs/gametest/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  client:
    name: Client tests / ${{ matrix.subject }}
    needs: plan
    if: needs.plan.outputs.client != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.client) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true

      - name: Run client tests
        uses: ./.github/actions/gradle-task
        with:
          task: ${{ matrix.task }}
          work-dir: .bertie-ci/client/${{ matrix.subject }}
          timeout: ${{ matrix.timeout }}
          wayland: true

      - name: Upload client-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-${{ matrix.subject }}-${{ github.sha }}
          path: |
            .bertie-ci/client/${{ matrix.subject }}/
            ${{ matrix.project }}/build/reports/
            ${{ matrix.project }}/build/test-results/clienttest/
            ${{ matrix.project }}/build/test-diagnostics/clienttest/
            ${{ matrix.project }}/build/runs/clienttest/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  validate:
    name: Validate / ${{ matrix.subject }}
    needs: plan
    if: needs.plan.outputs.validate != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.validate) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          gradle-cache: true

      - name: Structurally validate generated pack
        uses: ./.github/actions/pack-validate
        with:
          component: ${{ matrix.subject }}

  required:
    name: Required checks
    needs: [plan, infrastructure, gradle, gametest, client, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required jobs
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          GRADLE_RESULT: ${{ needs.gradle.result }}
          GAMETEST_RESULT: ${{ needs.gametest.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          results=(
            "Plan:$PLAN_RESULT"
            "Infrastructure:$INFRASTRUCTURE_RESULT"
            "Gradle:$GRADLE_RESULT"
            "GameTests:$GAMETEST_RESULT"
            "Client tests:$CLIENT_RESULT"
            "Pack validation:$VALIDATE_RESULT"
          )
          {
            echo "### Required checks"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=false
          for entry in "${results[@]}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success | skipped) ;;
              *) failed=true ;;
            esac
          done

          if [[ "$failed" == true ]]; then
            echo "One or more required jobs failed or were cancelled." >&2
            exit 1
          fi
