name: Publish GitHub release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded artifact containing release files
        required: true
        type: string
      files:
        description: Newline-separated release file globs
        required: false
        type: string
        default: .bertie-ci/release/*
      name:
        description: Release title
        required: true
        type: string
      body:
        description: Release description
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/release

      - name: Create GitHub release
        uses: bertie-mc/bertie/.github/actions/github-release@bertie-ci/v6.0.0
        with:
          files: ${{ inputs.files }}
          name: ${{ inputs.name }}
          body: ${{ inputs.body }}
