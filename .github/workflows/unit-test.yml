name: JVM unit tests

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's root bertie-ci.toml
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v5.0.0

      - name: Run unit tests
        uses: bertie-mc/bertie/.github/actions/unit-test@bertie-ci/v5.0.0
        with:
          component: ${{ inputs.component }}

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-${{ inputs.component }}-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14
