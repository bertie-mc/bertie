name: JVM unit tests

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's bertie-ci workspace
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Plan unit tests
        id: plan
        uses: bertie-mc/bertie/.github/actions/plan@bertie-ci/v6.0.0
        with:
          component: ${{ inputs.component }}

      - name: Set up dependencies
        if: steps.plan.outputs.unit != '[]'
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v6.0.0
        with:
          gradle-cache: true

      - name: Run unit tests
        if: steps.plan.outputs.unit != '[]'
        uses: bertie-mc/bertie/.github/actions/gradle-task@bertie-ci/v6.0.0
        with:
          task: ${{ fromJSON(steps.plan.outputs.unit)[0].task }}
          work-dir: .bertie-ci/unit
          timeout: 2700

      - name: Upload unit-test reports
        if: always() && steps.plan.outputs.unit != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-${{ inputs.component }}-${{ github.sha }}
          path: |
            .bertie-ci/unit/
            ${{ fromJSON(steps.plan.outputs.unit)[0].project }}/build/reports/tests/
            ${{ fromJSON(steps.plan.outputs.unit)[0].project }}/build/test-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
