name: NeoForge GameTests

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's bertie-ci workspace
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan GameTests
    runs-on: ubuntu-latest
    outputs:
      gametest: ${{ steps.plan.outputs.gametest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read source sets
        id: plan
        uses: bertie-mc/bertie/.github/actions/plan@bertie-ci/v6.0.0
        with:
          component: ${{ inputs.component }}

  gametest:
    name: GameTest / ${{ matrix.subject }}
    needs: plan
    if: needs.plan.outputs.gametest != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gametest) }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v6.0.0
        with:
          gradle-cache: true

      - name: Run GameTests
        uses: bertie-mc/bertie/.github/actions/gradle-task@bertie-ci/v6.0.0
        with:
          task: ${{ matrix.task }}
          work-dir: .bertie-ci/gametest
          timeout: ${{ matrix.timeout }}

      - name: Upload GameTest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gametest-${{ matrix.subject }}-${{ github.sha }}
          path: |
            .bertie-ci/gametest/
            ${{ matrix.project }}/build/reports/
            ${{ matrix.project }}/build/test-results/gametest/
            ${{ matrix.project }}/build/runs/gametest/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
