name: Build mod artifact

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's root bertie-ci.toml
        required: true
        type: string
      retention-days:
        description: Number of days to retain the built JAR
        required: false
        type: number
        default: 14
    outputs:
      artifact-name:
        description: Name of the uploaded JAR artifact
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-name: mod-${{ inputs.component }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v5.0.0

      - name: Build mod
        uses: bertie-mc/bertie/.github/actions/build-mod@bertie-ci/v5.0.0
        with:
          component: ${{ inputs.component }}

      - name: Upload built mod
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mod-${{ inputs.component }}-${{ github.sha }}
          path: .bertie-ci/artifacts/${{ inputs.component }}/*.jar
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
