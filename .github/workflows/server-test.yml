name: Component server suites

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's root bertie-ci.toml
        required: true
        type: string
      artifact-name:
        description: Uploaded production mod JAR artifact to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Read server suites
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.plan.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v5.0.0

      - name: Read descriptor
        id: plan
        uses: bertie-mc/bertie/.github/actions/plan@bertie-ci/v5.0.0
        with:
          component: ${{ inputs.component }}

  server:
    name: Server / ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.server != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.server) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v5.0.0

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Prepare server instance
        uses: bertie-mc/bertie/.github/actions/prepare-mod-instance@bertie-ci/v5.0.0
        with:
          component: ${{ inputs.component }}
          artifact: .bertie-ci/artifact
          fixture: ${{ matrix.fixture }}
          instance-files: ${{ matrix.instance_files }}
          side: server
          output-dir: .bertie-ci/server/${{ matrix.suite }}

      - name: Run server suite
        uses: bertie-mc/bertie/.github/actions/server-test@bertie-ci/v5.0.0
        with:
          instance: .bertie-ci/server/${{ matrix.suite }}/instance.json
          work-dir: .bertie-ci/server/${{ matrix.suite }}
          command-test: ${{ matrix.project }}/${{ matrix.command_test }}
          require-log: ${{ toJSON(matrix.require_log) }}
          timeout: ${{ matrix.timeout }}
          max-memory: ${{ matrix.max_memory }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-${{ inputs.component }}-${{ matrix.suite }}-${{ github.sha }}
          path: |
            .bertie-ci/server/${{ matrix.suite }}/**/*.log
            .bertie-ci/server/${{ matrix.suite }}/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
