name: Component client tests

on:
  workflow_call:
    inputs:
      component:
        description: Component subject declared by the caller's bertie-ci workspace
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan client tests
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.plan.outputs.client }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read source sets
        id: plan
        uses: bertie-mc/bertie/.github/actions/plan@bertie-ci/v6.0.0
        with:
          component: ${{ inputs.component }}

  client:
    name: Client tests / ${{ matrix.subject }}
    needs: plan
    if: needs.plan.outputs.client != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.client) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie/.github/actions/setup@bertie-ci/v6.0.0
        with:
          gradle-cache: true

      - name: Run client tests
        uses: bertie-mc/bertie/.github/actions/gradle-task@bertie-ci/v6.0.0
        with:
          task: ${{ matrix.task }}
          work-dir: .bertie-ci/client
          timeout: ${{ matrix.timeout }}
          wayland: true

      - name: Upload client-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-${{ matrix.subject }}-${{ github.sha }}
          path: |
            .bertie-ci/client/
            ${{ matrix.project }}/build/reports/
            ${{ matrix.project }}/build/test-results/clienttest/
            ${{ matrix.project }}/build/test-diagnostics/clienttest/
            ${{ matrix.project }}/build/runs/clienttest/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
