# Embedded external files are audited, but unknown or denied redistribution is not
# release-blocking yet.

strict = false

[evidence.modrinth-mit]
allowed = true
text = """
The listed Modrinth projects declare the MIT license. It permits redistribution
provided its copyright and permission notices are retained.
https://opensource.org/license/mit
"""

[evidence.modrinth-apache-2]
allowed = true
text = """
The listed Modrinth projects declare Apache-2.0. It permits redistribution subject to
its license and NOTICE requirements.
https://www.apache.org/licenses/LICENSE-2.0
"""

[evidence.modrinth-bsd-3]
allowed = true
text = """
Sparkles declares BSD-3-Clause on Modrinth. It permits redistribution provided its
copyright, license conditions, and disclaimer are retained.
https://opensource.org/license/bsd-3-clause
"""

[evidence.modrinth-gpl-3]
allowed = true
text = """
The listed Modrinth projects declare GPL-3.0-only. It permits redistribution subject to
the GPL's notice, license, and corresponding-source requirements.
https://www.gnu.org/licenses/gpl-3.0.html
"""

[evidence.modrinth-lgpl-2-1]
allowed = true
text = """
The listed Modrinth projects declare LGPL-2.1-only. It permits redistribution subject
to the LGPL's notice, license, and source requirements.
https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html
"""

[evidence.modrinth-lgpl-3]
allowed = true
text = """
The listed Modrinth projects declare LGPL-3.0-only. It permits redistribution subject
to the LGPL's notice, license, and source requirements.
https://www.gnu.org/licenses/lgpl-3.0.html
"""

[evidence.modrinth-lgpl-3-or-later]
allowed = true
text = """
The listed Modrinth projects declare LGPL-3.0-or-later. It permits redistribution
subject to the LGPL's notice, license, and source requirements.
https://www.gnu.org/licenses/lgpl-3.0.html
"""

[evidence.guideme-lgpl-3]
allowed = true
text = """
GuideME's repository declares LGPL-3.0 for the project. It permits redistribution
subject to the LGPL's notice, license, and source requirements.
https://github.com/AppliedEnergistics/GuideME/blob/main/LICENSE.md
"""

[evidence.modrinth-mpl-2]
allowed = true
text = """
The listed Modrinth projects declare MPL-2.0. It permits redistribution subject to the
MPL's notice, license, and source requirements for covered files.
https://www.mozilla.org/MPL/2.0/
"""

[evidence.modrinth-unlicense]
allowed = true
text = """
MonoLib declares the Unlicense on Modrinth, granting unrestricted copying and distribution.
https://unlicense.org/
"""

[evidence.modrinth-cc-by]
allowed = true
text = """
Exclusions Lib declares CC-BY-4.0 on Modrinth. It permits redistribution with
attribution and a license link.
https://creativecommons.org/licenses/by/4.0/
"""

[evidence.modrinth-cc-by-nc-nd]
allowed = true
text = """
Prism declares CC-BY-NC-ND-4.0 on Modrinth. It permits unmodified, noncommercial
redistribution with attribution and a license link.
https://creativecommons.org/licenses/by-nc-nd/4.0/
"""

[evidence.modrinth-cc-by-nc-sa-3]
allowed = true
text = """
Zeta declares CC-BY-NC-SA-3.0 on Modrinth. It permits noncommercial redistribution with
attribution, a license link, and ShareAlike compliance.
https://creativecommons.org/licenses/by-nc-sa/3.0/
"""

[evidence.modrinth-cc-by-nc-sa-4]
allowed = true
text = """
The listed Modrinth projects declare CC-BY-NC-SA-4.0. It permits noncommercial
redistribution with attribution, a license link, and ShareAlike compliance.
https://creativecommons.org/licenses/by-nc-sa/4.0/
"""

[evidence.modonomicon-mixed-open-licenses]
allowed = true
text = """
Modonomicon declares MIT for code and CC-BY-4.0 for assets. Both permit redistribution
when their respective notice and attribution conditions are met.
https://github.com/klikli-dev/modonomicon#licensing
"""

[evidence.azurune-modpack-permission]
allowed = true
text = """
The AZURUNE license grants modpack inclusion when the unmodified copy comes from the
author's Modrinth or CurseForge project and the required notice is included.
https://github.com/Yirmiri/Yirmiri/blob/main/AZURUNE-LICENSE.md
"""

[evidence.obscuria-platform-modpack-permission]
allowed = true
text = """
The Obscuria Ecosystem license permits unmodified inclusion in modpacks distributed
through Modrinth, CurseForge, or similar mod platforms.
https://obscurialithium.github.io/license/
"""

[evidence.polyform-shield]
allowed = true
text = """
HazentouveLib declares PolyForm Shield 1.0.0. It permits noncompeting redistribution
provided the license notice is included.
https://polyformproject.org/licenses/shield/1.0.0/
"""

[evidence.xaero-modpack-permission]
allowed = true
text = """
Xaero's World Map explicitly permits modpack inclusion, with distribution and
monetization conditions documented on its project page. This output remains within the
CurseForge ecosystem.
https://modrinth.com/mod/xaeros-world-map
"""

[evidence.hammerlib-modpack-permission]
allowed = true
text = """
HammerLib's project page explicitly permits use in modpacks and separately prohibits
unrelated reposts without permission and an official download link.
https://modrinth.com/mod/hammer-lib
"""

[evidence.collective-platform-modpack-permission]
allowed = true
text = """
Collective's project page permits modpack use while the download remains hosted within
the CurseForge or Modrinth ecosystem. This artifact is embedded only in the CurseForge
release profile.
https://modrinth.com/mod/collective
"""

[evidence.general-modpack-permission]
allowed = true
text = """
The CoroUtil and SuperMartijn642's Core Lib project pages explicitly permit use in
modpacks.
https://modrinth.com/mod/coroutil
https://modrinth.com/mod/supermartijn642s-core-lib
"""

[evidence.curseforge-gpl-3]
allowed = true
text = """
AlfinoLib declares GPLv3 on its CurseForge project page. It permits redistribution
subject to the GPL's notice, license, and corresponding-source requirements.
https://www.curseforge.com/minecraft/mc-mods/alfinolib
"""

[evidence.curseforge-mit]
allowed = true
text = """
Compact Machines and Inventory Management Deluxe declare MIT on their CurseForge
project pages. It permits redistribution provided its copyright and permission notices
are retained.
https://www.curseforge.com/minecraft/mc-mods/compact-machines
https://www.curseforge.com/minecraft/mc-mods/inventory-management-deluxe
"""

[evidence.curseforge-lgpl-3]
allowed = true
text = """
Particle Storm and Terra Curio declare LGPLv3 on their CurseForge project pages. It permits
redistribution subject to the LGPL's notice, license, and source requirements.
https://www.curseforge.com/minecraft/mc-mods/particle-storm
https://www.curseforge.com/minecraft/mc-mods/terra-curio
"""

[evidence.apotheosis-irons-compat-open-licenses]
allowed = true
text = """
The Apotheosis x Iron's Spellbooks compatibility project's source repository licenses
code under MIT and assets and documentation under CC-BY-4.0. Both permit redistribution
when their notice and attribution conditions are met.
https://github.com/muon-rw/Apotheosis-Irons-Spells
"""

[evidence.ftb-curseforge-only]
allowed = false
text = """
FTB reserves redistribution rights and states that CurseForge is the only authorized
distributor of FTB mods and modpacks containing them. Native CurseForge manifest
references are allowed; embedding these JARs in a Modrinth pack is not.
https://feed-the-beast.com/raw/docs/mod-license
https://www.feed-the-beast.com/policies/modpacks-mods-policy
"""

[evidence.crystal-nest-direct-packaging-prohibited]
allowed = false
text = """
The Crystal Nest Community License permits external references but prohibits directly
packaging or publicly redistributing the files.
https://github.com/Crystal-Nest/.github/blob/main/LICENSE
"""

[evidence.balm-rehosting-prohibited]
allowed = false
text = """
Twelve Iterations permits Balm in modpacks but explicitly prohibits publicly reuploading
or rehosting the mod file. A native provider reference would be allowed; embedding the
JAR is not.
https://mods.twelveiterations.com/permissions
"""

[evidence.moonlight-direct-packaging-prohibited]
allowed = false
text = """
Moonlight's license permits modpack use only when the file is obtained from an official
source and is not directly bundled, and prohibits public redistribution without written
permission.
https://github.com/MehVahdJukaar/Moonlight/blob/1.20/license.md
"""

[evidence.sirgrantd-direct-packaging-prohibited]
allowed = false
text = """
The SirGrantd license permits modpack use only for unmodified official copies that are
not directly bundled.
https://github.com/SirGrantd/MagicCoins/blob/main/LICENSE.md
"""

[evidence.timefall-manifest-only]
allowed = false
text = """
The Timefall Development License permits modpack inclusion only through a manifest that
downloads from the official project page; direct integration requires written
permission.
https://github.com/Sweenus/simplytooltips/blob/master/LICENSE.txt
"""

