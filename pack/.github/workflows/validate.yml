name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Pack integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Index is current
        run: |
          packwiz refresh
          if ! git diff --exit-code -- index.toml pack.toml; then
            echo "::error::index.toml is stale. Run 'packwiz refresh' and commit the result."
            exit 1
          fi
          echo "index.toml is up to date"

      - name: Every metafile declares a side
        run: |
          missing=0
          for f in mods/*.pw.toml; do
            grep -q '^side' "$f" || { echo "::error file=$f::no 'side' declared"; missing=1; }
          done
          exit $missing

      - name: No duplicate target filenames
        run: |
          dup=$(grep -h '^filename' mods/*.pw.toml | sed 's/filename = "//;s/"//' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::two metafiles resolve to the same filename - the pack would install two copies:"
            echo "$dup"
            exit 1
          fi
          echo "no duplicate targets"

      - name: No jars committed
        run: |
          jars=$(git ls-files '*.jar')
          if [ -n "$jars" ]; then
            echo "::error::mod jars must not be committed - reference them via packwiz instead:"
            echo "$jars"
            exit 1
          fi
          echo "no jars in the tree"

      - name: Summary
        run: |
          echo "### Pack summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mods | $(ls mods/*.pw.toml | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| client-only | $(grep -h '^side = "client"' mods/*.pw.toml | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| server-only | $(grep -h '^side = "server"' mods/*.pw.toml | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| both | $(grep -h '^side = \"both\"' mods/*.pw.toml | wc -l) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config files | $(find config -type f | wc -l) |" >> "$GITHUB_STEP_SUMMARY"

  resolve:
    name: Every download resolves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Serve the pack
        run: |
          packwiz serve --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/pack.toml >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/pack.toml >/dev/null

      - name: Download every mod (both sides)
        run: |
          mkdir -p /tmp/resolve && cd /tmp/resolve
          curl -sSL -o packwiz-installer-bootstrap.jar \
            https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          java -jar packwiz-installer-bootstrap.jar --no-gui -s both http://localhost:8080/pack.toml

      - name: Report what was fetched
        run: |
          count=$(ls /tmp/resolve/mods/*.jar 2>/dev/null | wc -l)
          echo "resolved $count mod jars"
          echo "### Resolved $count mod jars" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 400 ]; then
            echo "::error::only $count jars resolved - expected ~490"
            exit 1
          fi
