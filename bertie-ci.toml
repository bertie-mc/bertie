format = "bertie-ci.workspace.v2"

[workspace]
component-descriptors = [
  "mods/*/bertie-ci.toml",
  "pack/bertie-ci.toml",
]
shared-gradle-paths = [
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradle/",
  "build-logic/",
  "core/",
]
shared-all-paths = [
  "bertie-ci.toml",
  "flake.nix",
  "flake.lock",
  ".github/actions/",
  ".github/workflows/check.yml",
  "tools/bertie-ci/",
]
ignored-paths = [
  ".github/dependabot.yml",
  ".github/workflows/release.yml",
  ".gitignore",
  "README.md",
  "docs/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
  "**/README.md",
  "**/LICENSE",
  "**/NOTICE",
  "**/UNLICENSE",
]
