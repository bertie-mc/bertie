[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bertie-ci"
version = "6.0.0"
description = "Test planning and task supervision for bertie-mc"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "bertie-mc contributors" }]

[project.scripts]
bertie-ci = "bertie_ci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
