mod_description=Tiered, non-destructive weapon empowerment for the Bertie modpack. Adds two parallel upgrade tracks to unique weapons - flat base-damage tiers and Iron's Spells spell-power tiers built by filling a ring of elemental upgrade orbs - stored in Iron's own upgrade_data component so they stack with Apotheosis affixes, enchantments and durability instead of clearing them.
