mod_description=Runtime fixes for two Alex's Caves crashes on NeoForge 21.1. Its biome-decoration index clamp falls back to index 0 without checking for an empty list, so it throws the very IndexOutOfBoundsException it exists to prevent and kills the server's worldgen thread. Its spawn-egg lookup identifies eggs by calling getType(null), which NeoForge 21.1.233 no longer tolerates, so pick block on an affected entity crashes the client.
