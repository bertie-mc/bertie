mod_description=Keeps chunk generation alive when Alex's Caves' biome-decoration index clamp is handed an empty feature list. The clamp falls back to index 0 without checking for an empty list, so it throws the very IndexOutOfBoundsException it exists to prevent, killing the server's worldgen thread. This narrowly absorbs that one failure and lets the chunk finish.
