mod_description=Runtime fixes for Alex's Caves on NeoForge 21.1. Its cave biomes declare features in the STRONGHOLDS decoration step, which nothing else populates, so the lookup misses and its own index clamp throws on the empty list - taking the chunk's remaining five decoration steps with it, which is why Primordial Caves grow no trees and Magnetic Caves have no crystals. Its Ferrocave and Forlorn Canyon pieces never call replaceBiomes as the other four cave types do, so those two caves keep the vanilla biome below wherever the sampled depth leaves Alex's Caves' climate window and generate half-vanilla. Its spawn-egg lookup identifies eggs by calling getType(null), which NeoForge 21.1.233 no longer tolerates, so pick block on an affected entity crashes the client.
