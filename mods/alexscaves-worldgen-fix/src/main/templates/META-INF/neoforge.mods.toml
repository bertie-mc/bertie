modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# Vanilla targets - must apply, and does so whether or not Alex's Caves is installed.
[[mixins]]
config = "${mod_id}.mixins.json"

# Alex's Caves' own classes. Separate config so that removing the mod leaves this one unapplied
# instead of failing the whole configuration at load.
[[mixins]]
config = "${mod_id}.alexscaves.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "alexscaves"
type = "optional"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
