mod_description=Authoritative, data-driven mining-tier system for the Bertie modpack. One server-side JSON file lists tiers (name + numeric level + tools + blocks) plus point exceptions, and its verdict overrides vanilla tool tags, other mods' mining levels and Slag n' Embers' parallel modular tier system for every block it controls. Blocks that are not listed keep their original behaviour.
