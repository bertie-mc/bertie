mod_description=Hephaestus Forge (Forbidden Arcanus) runs on Iron's Spells 'n Spellbooks ink instead of experience. Each forge tier accepts only its matching ink tier (Common=I, Uncommon=II, Rare=III, Epic=IV, Legendary=V); each ink tier gives double the previous (40/80/160/320/640 essence). XP bottles, Xpetrified Orbs and disenchanting no longer fill the forge; the essence is renamed to Ink in the UI.
