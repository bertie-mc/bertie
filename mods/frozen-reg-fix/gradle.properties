mod_name=Frozen Registry Fix
mod_license=Unlicense
mod_version=2.3.0
mod_group_id=com.berlord.frozenregfix
mod_authors=berlord
mod_description=Force-initializes mods that register registry content in a lazily-loaded static initializer (e.g. Immersive Armors' Items class) before the registries freeze, fixing 'Registry is already frozen' crashes in large packs. v2.1.0 hooks BOTH GameData.freezeData() HEAD and the low-level MappedRegistry.freeze() of the armor_material registry, so the force-init fires even when load-order disruptors (e.g. railways-untold / Create coremods) reroute the freeze around GameData.freezeData.
