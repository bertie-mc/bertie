mod_description=Turns Forbidden and Arcanus' Black Hole into a levelled machine. Feed it configurable "counter" items until every counter for the next level is full, and the hole transforms - new sound, new particle colour, and a new set of exchange recipes. Base black hole behaviour (pull, XP to Xpetrified Orb) is untouched. Everything is driven by one JSON file in config/.
