side="BOTH"

[[dependencies.${mod_id}]]
modId="patchouli"
type="required"
versionRange="[1.21.1-93-NEOFORGE,)"
ordering="AFTER"
side="BOTH"

# EMI discovers the built-in client plugin through @EmiEntrypoint when the viewer is installed.
[[dependencies.${mod_id}]]
