versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="armageddon_mod"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Data overrides only win when we load last, so every namespace under
# src/main/resources/data that is not ours is ordered AFTER here.
[[dependencies.${mod_id}]]
modId="alexscaves"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

