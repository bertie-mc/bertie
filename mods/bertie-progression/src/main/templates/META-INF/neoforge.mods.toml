type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Load after discerning_the_eldritch: its three sheaths are removed with the sheath slot.
[[dependencies.${mod_id}]]
modId="discerning_the_eldritch"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Load after kaleidoscope_doll: it redeclares the shared head slot as doll-only.
[[dependencies.${mod_id}]]
modId="kaleidoscope_doll"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Apotheosis rolls affixed gear and dresses its bosses from its own data, so removed armour
# has to be taken out of those lists too.
[[dependencies.${mod_id}]]
modId="apotheosis"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Recipe override: its enchanting table is the pack's only one, and it costs a spirit altar.
[[dependencies.${mod_id}]]
modId="apothic_enchanting"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Loot override: the Rooted Boots leave the mimic's loot table.
[[dependencies.${mod_id}]]
modId="artifacts"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Loot override: four removed drops leave its boss loot tables.
[[dependencies.${mod_id}]]
modId="block_factorys_bosses"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Loot override: the Castle Keeper stops dropping Phantom armour.
[[dependencies.${mod_id}]]
modId="twilight_forest_final_boss"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# The culled TerraCurio accessories are disabled by overriding TerraCurio's own recipe files, so
# we have to load after it or its originals win.
[[dependencies.${mod_id}]]
modId="terra_curio"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="nameless_trinkets"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Antarchy anchors its Duct Tape on vanilla shears and its Diamond Minecart on vanilla minecart in
# the Tools and Utilities tab, and hard-crashes on load if an anchor is missing. TabAnchors puts
# them there on event priority HIGHEST, which does not need us to load first - so this is AFTER,
# which is what our data overrides for antarchy require to win.
[[dependencies.${mod_id}]]
modId="antarchy"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# Altar of Amethyst behaviour. required=false in the config, so a pack without
# Cataclysm simply never applies it.
[[mixins]]
config="bertieprogression.mixins.json"

