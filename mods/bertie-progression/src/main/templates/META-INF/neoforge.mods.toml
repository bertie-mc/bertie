# Each of these declares a curios slot the pack re-sizes or re-orders, and Curios applies slot
# files in namespace order - so the override has to be written over the declaring mod's own
# path, which only wins if we load after it.
[[dependencies.${mod_id}]]
modId="aces_spell_utils"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="compactmachines"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
