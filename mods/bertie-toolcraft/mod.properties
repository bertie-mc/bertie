mod_description=Unifies tool crafting for the Bertie modpack onto a single part system. Magitech supplies the parts and assembly; Slag n' Embers keeps its metallurgy but loses its own tool ladder; Carving keeps supplying early-game part blanks. Reduces Magitech to four tools (pickaxe, axe, shovel, scythe), each built from head + handle + binding, makes them enchantable like their vanilla counterparts, and reworks the scythe into a hoe with area harvest of instantly-breakable plants.
