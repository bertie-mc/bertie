[versions]
javafml-loader = "4"
moddev = "2.0.134"
neoform-runtime = "2.0.18"
parchment-mappings = "2024.11.17"
junit = "6.1.2"
mockito = "5.23.0"
gson = "2.14.0"
asm = "9.8"
lwjgl = "3.3.3"
shadow = "9.2.2"
spotless = "8.9.0"
palantir-java-format = "2.92.0"
ktlint = "1.8.0"
arboard = "1.1.3"
native-utils = "1.0.0"
night-config = "3.8.3"
ponder = "1.0.82+mc1.21.1"
flywheel = "1.0.6"
jankson = "1.2.2"
tomlkt = "0.3.7"

[libraries]
moddev-gradle = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
parchment-data = { module = "org.parchmentmc.data:parchment-1.21.1", version.ref = "parchment-mappings" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
arboard = { module = "io.github.imurx:arboard", version.ref = "arboard" }
native-utils = { module = "com.github.ramanrajarathinam:native-utils", version.ref = "native-utils" }
night-config-toml = { module = "com.electronwill.night-config:toml", version.ref = "night-config" }
ponder = { module = "net.createmod.ponder:ponder-neoforge", version.ref = "ponder" }
flywheel = { module = "dev.engine-room.flywheel:flywheel-neoforge-1.21.1", version.ref = "flywheel" }
jankson = { module = "blue.endless:jankson", version.ref = "jankson" }
tomlkt = { module = "net.peanuuutz.tomlkt:tomlkt-jvm", version.ref = "tomlkt" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-freetype = { module = "org.lwjgl:lwjgl-freetype", version.ref = "lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-jemalloc = { module = "org.lwjgl:lwjgl-jemalloc", version.ref = "lwjgl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl" }
lwjgl-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd", version.ref = "lwjgl" }

[bundles]
lwjgl-natives = [
  "lwjgl",
  "lwjgl-freetype",
  "lwjgl-glfw",
  "lwjgl-jemalloc",
  "lwjgl-openal",
  "lwjgl-opengl",
  "lwjgl-stb",
  "lwjgl-tinyfd",
]
