# Gradle resolves Maven when available, then Modrinth, then CurseForge.
# Packwiz metadata uses Modrinth when available, then CurseForge.
# A Modrinth record includes the immutable release's primary filename so packwiz can
# emit the canonical Modrinth CDN URL without querying provider APIs during generation.
# The optional lowercase side field describes physical installation compatibility.
# It defaults to "both"; only client- or server-only artifacts specify it.

